<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Search Catalog</title>
  <meta name="description" content="Search apparel, fashion, fits, and trending styles.">

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-body: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-color: #0f172a;
      --accent-hover: #1e293b;
      --accent-light: #f1f5f9;
      --sale-red: #ef4444;
      --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.dark {
      --bg-body: #090d16;
      --bg-surface: #111827;
      --bg-card: #151e32;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1f293d;
      --accent-color: #ffffff;
      --accent-hover: #e2e8f0;
      --accent-light: #1e293b;
      --sale-red: #f87171;
      --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 90px;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Site Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 80px;
    }

    .header-right { justify-content: flex-end; }
    .header-center { flex: 1; display: flex; justify-content: center; }

    .brand-logo-img {
      width: 150px;
      height: 50px;
      object-fit: contain;
      display: block;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: var(--transition);
      text-decoration: none;
    }

    .icon-btn:hover { background: var(--accent-light); }
    .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }

    .cart-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--sale-red);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      line-height: 18px;
      border-radius: var(--radius-full);
      text-align: center;
      padding: 0 4px;
      display: none;
    }

    /* Side Drawer */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .drawer-overlay.active { opacity: 1; visibility: visible; }

    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 320px;
      max-width: 85vw;
      height: 100%;
      background: var(--bg-surface);
      z-index: 101;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }
    .drawer.active { transform: translateX(0); }

    .drawer-header {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }
    .drawer-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .drawer-section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 12px;
    }
    .drawer-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--text-main);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
    }

    .theme-toggle-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
    }
    .theme-toggle-input {
      appearance: none;
      width: 46px;
      height: 26px;
      background: var(--border-color);
      border-radius: var(--radius-full);
      position: relative;
      cursor: pointer;
    }
    .theme-toggle-input::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: #ffffff;
      border-radius: var(--radius-full);
      transition: transform 0.25s ease;
    }
    .theme-toggle-input:checked { background: var(--accent-color); }
    .theme-toggle-input:checked::after { transform: translateX(20px); background: #0f172a; }
    body.dark .theme-toggle-input:checked::after { background: #ffffff; }

    .lang-select-box {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 14px;
    }

    /* Search Area */
    .search-bar-wrap {
      margin: 20px 0 16px 0;
      position: relative;
      display: flex;
      gap: 8px;
    }

    .search-input-box {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0 14px;
      transition: var(--transition);
    }

    .search-input-box:focus-within {
      border-color: var(--text-main);
      box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
    }

    .search-input-box svg {
      width: 20px;
      height: 20px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
      margin-right: 10px;
    }

    .search-field {
      flex: 1;
      height: 46px;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
    }

    .clear-search-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: none;
    }

    .clear-search-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      margin: 0;
    }

    .search-action-btn {
      height: 46px;
      padding: 0 20px;
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    body.dark .search-action-btn {
      background: #ffffff;
      color: #0f172a;
    }

    /* Suggestions */
    .suggestions-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 24px;
    }

    .suggestion-chip {
      padding: 6px 14px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .suggestion-chip:hover {
      color: var(--text-main);
      border-color: var(--text-main);
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 640px) {
      .product-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
    }

    @media (min-width: 1024px) {
      .product-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .product-img-wrap {
      position: relative;
      width: 100%;
      padding-top: 120%;
      background: var(--accent-light);
      cursor: pointer;
    }

    .product-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .save-badge-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      cursor: pointer;
    }

    .save-badge-btn.saved { color: var(--sale-red); }
    .save-badge-btn.saved svg { fill: var(--sale-red); }
    .save-badge-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; }

    .product-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .product-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 10px;
    }

    .offer-price { font-size: 15px; font-weight: 700; }
    .original-price { font-size: 12px; color: var(--text-muted); text-decoration: line-through; }

    .btn-add-cart {
      width: 100%;
      height: 36px;
      border-radius: var(--radius-md);
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    body.dark .btn-add-cart { background: #ffffff; color: #0f172a; }

    /* Floating Bottom Nav */
    .floating-nav {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px -4px rgba(0, 0, 0, 0.15);
      border-radius: var(--radius-full);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 40;
    }

    .nav-pill-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      text-decoration: none;
      color: var(--text-muted);
    }
    .nav-pill-item svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; margin-bottom: 2px; }
    .nav-pill-item span { font-size: 10px; font-weight: 600; }
    .nav-pill-item.active { background: var(--accent-light); color: var(--text-main); }
    body.dark .nav-pill-item.active { background: #1e293b; color: #ffffff; }

    /* Modal / Size Picker */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 150;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      padding: 16px;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-dialog {
      background: var(--bg-surface);
      width: 100%;
      max-width: 400px;
      border-radius: var(--radius-lg);
      padding: 24px;
    }
    .size-chips-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    .size-chip {
      padding: 8px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .size-chip.selected { background: var(--accent-color); color: #ffffff; }
    body.dark .size-chip.selected { color: #0f172a; }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: #0f172a;
      color: #ffffff;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      pointer-events: auto;
      transform: translateY(-20px);
      opacity: 0;
      transition: all 0.25s ease;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>

      let uid = localStorage.getItem("userId");
      if (!uid) {
        uid = "user_" + Date.now() + "_" + Math.random().toString(36).substring(2, 9);
        localStorage.setItem("userId", uid);
      }
      return uid;
    }
    const currentUserId = getUserId();

    /* Theme & Drawer */
    const themeSwitch = document.getElementById("themeSwitchCheckbox");
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
      if (themeSwitch) themeSwitch.checked = true;
    }
    if (themeSwitch) {
      themeSwitch.addEventListener("change", (e) => {
        if (e.target.checked) {
          document.body.classList.add("dark");
          localStorage.setItem("theme", "dark");
        } else {
          document.body.classList.remove("dark");
          localStorage.setItem("theme", "light");
        }
      });
    }

    const drawerToggleBtn = document.getElementById("drawerToggleBtn");
    const drawerCloseBtn = document.getElementById("drawerCloseBtn");
    const sideDrawer = document.getElementById("sideDrawer");
    const drawerOverlay = document.getElementById("drawerOverlay");

    function openDrawer() { sideDrawer.classList.add("active"); drawerOverlay.classList.add("active"); }
    function closeDrawer() { sideDrawer.classList.remove("active"); drawerOverlay.classList.remove("active"); }
    if (drawerToggleBtn) drawerToggleBtn.addEventListener("click", openDrawer);
    if (drawerCloseBtn) drawerCloseBtn.addEventListener("click", closeDrawer);
    if (drawerOverlay) drawerOverlay.addEventListener("click", closeDrawer);

    function showToast(msg) {
      const container = document.getElementById("toastContainer");
      const t = document.createElement("div");
      t.className = "toast";
      t.textContent = msg;
      container.appendChild(t);
      requestAnimationFrame(() => t.classList.add("show"));
      setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 3000);
    }

    function updateCartBadge() {
      try {
        const cart = JSON.parse(localStorage.getItem("cart") || "[]");
        const total = cart.reduce((s, i) => s + (parseInt(i.quantity) || 1), 0);
        const b = document.getElementById("cartBadgeCount");
        if (b) {
          b.textContent = total > 99 ? "99+" : total;
          b.style.display = total > 0 ? "inline-block" : "none";
        }
      } catch (e) {}
    }
    updateCartBadge();

    /* Search State */
    let catalog = [];
    let savedProductIds = new Set();
    let pendingCartProduct = null;
    let selectedModalSize = "";

    function initSaved() {
      try {
        const saved = JSON.parse(localStorage.getItem("saved_items") || "[]");
        savedProductIds = new Set(saved.map(i => i.id));
      } catch (e) {}
    }
    initSaved();

    const searchInput = document.getElementById("searchInputField");
    const clearBtn = document.getElementById("clearSearchBtn");
    const searchBtn = document.getElementById("searchSubmitBtn");

    searchInput.addEventListener("input", (e) => {
      const q = e.target.value;
      clearBtn.style.display = q ? "block" : "none";
      filterCatalog(q);
    });

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      clearBtn.style.display = "none";
      filterCatalog("");
      searchInput.focus();
    });

    searchBtn.addEventListener("click", () => {
      filterCatalog(searchInput.value);
    });

    function executeSearch(keyword) {
      searchInput.value = keyword;
      clearBtn.style.display = "block";
      filterCatalog(keyword);
    }

    function filterCatalog(query) {
      const q = query.trim().toLowerCase();
      let results = catalog;

      if (q) {
        results = catalog.filter(p => {
          const title = (p.title || "").toLowerCase();
          const cat = (p.category || "").toLowerCase();
          const sub = (p.subcategory || "").toLowerCase();
          const desc = (p.description || "").toLowerCase();
          return title.includes(q) || cat.includes(q) || sub.includes(q) || desc.includes(q);
        });
        document.getElementById("searchHeading").textContent = `Results for "${query}"`;
      } else {
        document.getElementById("searchHeading").textContent = "Search Results";
      }

      document.getElementById("resultCountBadge").textContent = `${results.length} Found`;
      renderProducts(results);
    }

    function renderProducts(products) {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = "";

      if (products.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 48px 16px; background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border-color);">
            <svg viewBox="0 0 24 24" width="48" height="48" stroke="var(--text-muted)" stroke-width="1.5" fill="none" style="margin-bottom: 12px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 4px;">No products found</h3>
            <p style="font-size: 13px; color: var(--text-muted);">Try searching for Jeans, T-Shirt, Shirt, or Track Pants.</p>
          </div>
        `;
        return;
      }

      products.forEach(p => {
        const isSaved = savedProductIds.has(p.id);
        const img = p.images && p.images[0] ? p.images[0] : 'https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=800&q=80';
        const orig = p.price || p.originalPrice || (p.offerPrice * 1.3);
        const offer = p.offerPrice || p.price;

        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <div class="product-img-wrap" onclick="window.location.href='productdetails.html?id=${p.id}'">
            <img src="${img}" alt="${p.title}" class="product-img" loading="lazy">
            <button class="save-badge-btn ${isSaved ? 'saved' : ''}" onclick="toggleSave(event, '${p.id}')">
              <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </button>
          </div>
          <div class="product-info">
            <div>
              <h3 class="product-title" onclick="window.location.href='productdetails.html?id=${p.id}'">${p.title}</h3>
              <div class="price-row">
                <span class="offer-price">&#8377;${offer}</span>
                ${orig > offer ? `<span class="original-price">&#8377;${orig}</span>` : ''}
              </div>
            </div>
            <button class="btn-add-cart" onclick="handleAddToCart(event, '${p.id}')">Add To Cart</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function toggleSave(e, pid) {
      e.stopPropagation();
      const prod = catalog.find(p => p.id === pid);
      if (!prod) return;

      let saved = JSON.parse(localStorage.getItem("saved_items") || "[]");
      const idx = saved.findIndex(i => i.id === pid);

      if (idx > -1) {
        saved.splice(idx, 1);
        savedProductIds.delete(pid);
        showToast("Removed from wishlist");
      } else {
        saved.push({
          id: prod.id,
          title: prod.title,
          price: prod.price,
          offerPrice: prod.offerPrice,
          rating: prod.rating || 4.5,
          image: prod.images && prod.images[0] ? prod.images[0] : "",
          savedAt: Date.now()
        });
        savedProductIds.add(pid);
        showToast("Saved to wishlist");
      }

      localStorage.setItem("saved_items", JSON.stringify(saved));
      filterCatalog(searchInput.value);
      db.ref(`users/${currentUserId}/saved/${pid}`).set(idx > -1 ? null : true).catch(()=>{});
    }

    function handleAddToCart(e, pid) {
      e.stopPropagation();
      const prod = catalog.find(p => p.id === pid);
      if (!prod) return;

      if (prod.sizes && prod.sizes.length > 0) {
        openSizeModal(prod);
      } else {
        executeAddToCart(prod, "Standard");
      }
    }

    function openSizeModal(prod) {
      pendingCartProduct = prod;
      selectedModalSize = prod.sizes[0] || "";
      const modal = document.getElementById("sizeModalOverlay");
      const chips = document.getElementById("modalSizeChips");
      chips.innerHTML = "";

      prod.sizes.forEach((s, i) => {
        const chip = document.createElement("button");
        chip.className = "size-chip" + (i === 0 ? " selected" : "");
        chip.textContent = s;
        chip.addEventListener("click", () => {
          document.querySelectorAll(".size-chip").forEach(c => c.classList.remove("selected"));
          chip.classList.add("selected");
          selectedModalSize = s;
        });
        chips.appendChild(chip);
      });

      modal.classList.add("active");
    }

    document.getElementById("modalConfirmSizeBtn").addEventListener("click", () => {
      if (pendingCartProduct && selectedModalSize) {
        executeAddToCart(pendingCartProduct, selectedModalSize);
        document.getElementById("sizeModalOverlay").classList.remove("active");
      }
    });

    document.getElementById("sizeModalOverlay").addEventListener("click", (e) => {
      if (e.target === document.getElementById("sizeModalOverlay")) {
        document.getElementById("sizeModalOverlay").classList.remove("active");
      }
    });

    function executeAddToCart(prod, size) {
      let cart = JSON.parse(localStorage.getItem("cart") || "[]");
      const existing = cart.find(i => i.id === prod.id && i.size === size);

      if (existing) {
        existing.quantity = Math.min(99, (parseInt(existing.quantity) || 1) + 1);
      } else {
        cart.push({
          id: prod.id,
          title: prod.title,
          price: prod.offerPrice || prod.price,
          originalPrice: prod.price,
          image: prod.images && prod.images[0] ? prod.images[0] : '',
          size: size,
          quantity: 1,
          stock: prod.stock || 99,
          addedAt: Date.now()
        });
      }

      localStorage.setItem("cart", JSON.stringify(cart));
      updateCartBadge();
      showToast("Added to Cart");
      db.ref(`users/${currentUserId}/cart`).set(cart).catch(()=>{});
    }

    function loadCatalog() {
      db.ref("products").on("value", (snap) => {
        const val = snap.val();
        if (val) {
          catalog = Object.keys(val).map(k => ({ id: k, ...val[k] }));
        } else {
          catalog = [
            { id: "prod_1", title: "Relaxed Fit Denim Jeans", category: "Jeans", price: 1999, offerPrice: 1299, sizes: ["28", "30", "32", "34"], images: ["https://images.unsplash.com/photo-1542272604-780c96856592?w=800&q=80"] },
            { id: "prod_2", title: "Heavyweight Boxy Oversized T-Shirt", category: "T-Shirt", price: 1299, offerPrice: 699, sizes: ["S", "M", "L", "XL"], images: ["https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=800&q=80"] },
            { id: "prod_3", title: "Tapered Cotton Cargo Track Pants", category: "Track Pants", price: 1599, offerPrice: 999, sizes: ["M", "L", "XL"], images: ["https://images.unsplash.com/photo-1552902865-b72c031ac5ea?w=800&q=80"] },
            { id: "prod_4", title: "Premium Pique Knit Polo T-Shirt", category: "Polo T-Shirt", price: 1499, offerPrice: 849, sizes: ["M", "L", "XL"], images: ["https://images.unsplash.com/photo-1581655353564-df123a1eb820?w=800&q=80"] },
            { id: "prod_5", title: "Tailored Oxford Formal Shirt", category: "Shirt", price: 1899, offerPrice: 1149, sizes: ["38", "40", "42"], images: ["https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=800&q=80"] }
          ];
        }
        filterCatalog("");
      });
    }

    window.addEventListener("DOMContentLoaded", loadCatalog);
  </script>

  <!-- Auto logo swap on dark/light mode -->
  <script>
  (function () {
    var DARK_LOGO = "https://i.ibb.co/Xk500xcc/Picsart-26-11-10-20-55-03-987.png";
    var LIGHT_LOGO = "https://i.ibb.co/0R8RGqsm/file-0000000028dc820784541b310e0692bb.png";
    function syncLogos() {
      var dark = document.body.classList.contains("dark");
      document.querySelectorAll("img.brand-logo-img, img.footer-logo").forEach(function (img) {
        img.src = dark ? DARK_LOGO : LIGHT_LOGO;
      });
    }
    new MutationObserver(syncLogos).observe(document.body, { attributes: true, attributeFilter: ["class"] });
    if (document.readyState !== "loading") { syncLogos(); }
    else { document.addEventListener("DOMContentLoaded", syncLogos); }
  })();
  </script>
</body>
</html>
