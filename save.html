<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Saved Items</title>
  <meta name="description" content="Manage your saved apparel favorites and move them to cart anytime.">

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-body: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-color: #0f172a;
      --accent-hover: #1e293b;
      --accent-light: #f1f5f9;
      --sale-red: #ef4444;
      --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.dark {
      --bg-body: #090d16;
      --bg-surface: #111827;
      --bg-card: #151e32;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1f293d;
      --accent-color: #ffffff;
      --accent-hover: #e2e8f0;
      --accent-light: #1e293b;
      --sale-red: #f87171;
      --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 90px;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Site Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 80px;
    }

    .header-right { justify-content: flex-end; }
    .header-center { flex: 1; display: flex; justify-content: center; }

    .brand-logo-img {
      width: 150px;
      height: 50px;
      object-fit: contain;
      display: block;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: var(--transition);
      text-decoration: none;
    }

    .icon-btn:hover { background: var(--accent-light); }
    .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }

    .cart-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--sale-red);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      line-height: 18px;
      border-radius: var(--radius-full);
      text-align: center;
      padding: 0 4px;
      display: none;
    }

    /* Side Drawer */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .drawer-overlay.active { opacity: 1; visibility: visible; }

    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 320px;
      max-width: 85vw;
      height: 100%;
      background: var(--bg-surface);
      z-index: 101;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }
    .drawer.active { transform: translateX(0); }

    .drawer-header {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }
    .drawer-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .drawer-section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 12px;
    }
    .drawer-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--text-main);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
    }

    .theme-toggle-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
    }
    .theme-toggle-input {
      appearance: none;
      width: 46px;
      height: 26px;
      background: var(--border-color);
      border-radius: var(--radius-full);
      position: relative;
      cursor: pointer;
    }
    .theme-toggle-input::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: #ffffff;
      border-radius: var(--radius-full);
      transition: transform 0.25s ease;
    }
    .theme-toggle-input:checked { background: var(--accent-color); }
    .theme-toggle-input:checked::after { transform: translateX(20px); background: #0f172a; }
    body.dark .theme-toggle-input:checked::after { background: #ffffff; }

    .lang-select-box {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 14px;
    }

    /* Wishlist Grid */
    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    @media (min-width: 640px) {
      .wishlist-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
    }

    @media (min-width: 1024px) {
      .wishlist-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .product-img-wrap {
      position: relative;
      width: 100%;
      padding-top: 120%;
      background: var(--accent-light);
      cursor: pointer;
    }

    .product-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .remove-wish-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0,0,0,0.06);
      color: var(--sale-red);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .remove-wish-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .product-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .product-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 10px;
    }

    .offer-price { font-size: 15px; font-weight: 700; }
    .original-price { font-size: 12px; color: var(--text-muted); text-decoration: line-through; }

    .btn-add-cart {
      width: 100%;
      height: 36px;
      border-radius: var(--radius-md);
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    body.dark .btn-add-cart { background: #ffffff; color: #0f172a; }

    /* Empty State */
    .empty-wishlist-wrap {
      text-align: center;
      padding: 64px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      margin-top: 24px;
    }

    .empty-wishlist-wrap svg {
      width: 64px;
      height: 64px;
      stroke: var(--text-muted);
      stroke-width: 1.5;
      fill: none;
      margin-bottom: 16px;
    }

    /* Floating Pill Bottom Navigation */
    .floating-nav {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px -4px rgba(0, 0, 0, 0.15);
      border-radius: var(--radius-full);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 40;
    }

    .nav-pill-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      text-decoration: none;
      color: var(--text-muted);
    }
    .nav-pill-item svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; margin-bottom: 2px; }
    .nav-pill-item span { font-size: 10px; font-weight: 600; }
    .nav-pill-item.active { background: var(--accent-light); color: var(--text-main); }
    body.dark .nav-pill-item.active { background: #1e293b; color: #ffffff; }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: #0f172a;
      color: #ffffff;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      pointer-events: auto;
      transform: translateY(-20px);
      opacity: 0;
      transition: all 0.25s ease;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBQnUabSu6WGbq1te-hBEAYPZdOO93_Mfk",
      authDomain: "mega-store-2025.firebaseapp.com",
      databaseURL: "https://mega-store-2025-default-rtdb.firebaseio.com",
      projectId: "mega-store-2025",
      storageBucket: "mega-store-2025.firebasestorage.app",
      messagingSenderId: "190838364165",
      appId: "1:190838364165:web:43a969b7b852777061e46c",
      measurementId: "G-CZR2N1HF9K"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function getUserId() {
      let uid = localStorage.getItem("userId");
      if (!uid) {
        uid = "user_" + Date.now() + "_" + Math.random().toString(36).substring(2, 9);
        localStorage.setItem("userId", uid);
      }
      return uid;
    }
    const currentUserId = getUserId();

    /* Theme & Drawer */
    const themeSwitch = document.getElementById("themeSwitchCheckbox");
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
      if (themeSwitch) themeSwitch.checked = true;
    }
    if (themeSwitch) {
      themeSwitch.addEventListener("change", (e) => {
        if (e.target.checked) {
          document.body.classList.add("dark");
          localStorage.setItem("theme", "dark");
        } else {
          document.body.classList.remove("dark");
          localStorage.setItem("theme", "light");
        }
      });
    }

    const drawerToggleBtn = document.getElementById("drawerToggleBtn");
    const drawerCloseBtn = document.getElementById("drawerCloseBtn");
    const sideDrawer = document.getElementById("sideDrawer");
    const drawerOverlay = document.getElementById("drawerOverlay");

    function openDrawer() { sideDrawer.classList.add("active"); drawerOverlay.classList.add("active"); }
    function closeDrawer() { sideDrawer.classList.remove("active"); drawerOverlay.classList.remove("active"); }
    if (drawerToggleBtn) drawerToggleBtn.addEventListener("click", openDrawer);
    if (drawerCloseBtn) drawerCloseBtn.addEventListener("click", closeDrawer);
    if (drawerOverlay) drawerOverlay.addEventListener("click", closeDrawer);

    function showToast(msg) {
      const container = document.getElementById("toastContainer");
      const t = document.createElement("div");
      t.className = "toast";
      t.textContent = msg;
      container.appendChild(t);
      requestAnimationFrame(() => t.classList.add("show"));
      setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 3000);
    }

    function updateCartBadge() {
      try {
        const cart = JSON.parse(localStorage.getItem("cart") || "[]");
        const total = cart.reduce((s, i) => s + (parseInt(i.quantity) || 1), 0);
        const b = document.getElementById("cartBadgeCount");
        if (b) {
          b.textContent = total > 99 ? "99+" : total;
          b.style.display = total > 0 ? "inline-block" : "none";
        }
      } catch (e) {}
    }
    updateCartBadge();

    /* Wishlist Operations */
    let savedItems = [];

    function loadSavedItems() {
      try {
        savedItems = JSON.parse(localStorage.getItem("saved_items") || "[]");
      } catch (e) {
        savedItems = [];
      }
      renderWishlist();
    }

    function renderWishlist() {
      const contentWrap = document.getElementById("savedContentWrap");
      const emptyWrap = document.getElementById("emptySavedWrap");
      const grid = document.getElementById("wishlistGrid");

      if (savedItems.length === 0) {
        contentWrap.style.display = "none";
        emptyWrap.style.display = "block";
        return;
      }

      contentWrap.style.display = "block";
      emptyWrap.style.display = "none";
      document.getElementById("savedCountBadge").textContent = `${savedItems.length} Items`;

      grid.innerHTML = "";
      savedItems.forEach((item, index) => {
        const img = item.image || 'https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=800&q=80';
        const orig = item.price || (item.offerPrice * 1.3);
        const offer = item.offerPrice || item.price;

        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <div class="product-img-wrap" onclick="window.location.href='productdetails.html?id=${item.id}'">
            <img src="${img}" alt="${item.title}" class="product-img" loading="lazy">
            <button class="remove-wish-btn" onclick="removeWishItem(event, ${index}, '${item.id}')" aria-label="Remove item">
              <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
          <div class="product-info">
            <div>
              <h3 class="product-title" onclick="window.location.href='productdetails.html?id=${item.id}'">${item.title}</h3>
              <div class="price-row">
                <span class="offer-price">&#8377;${offer}</span>
                ${orig > offer ? `<span class="original-price">&#8377;${orig}</span>` : ''}
              </div>
            </div>
            <button class="btn-add-cart" onclick="moveToCart(event, ${index})">Move to Cart</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function removeWishItem(e, index, pid) {
      e.stopPropagation();
      savedItems.splice(index, 1);
      localStorage.setItem("saved_items", JSON.stringify(savedItems));
      db.ref(`users/${currentUserId}/saved/${pid}`).set(null).catch(()=>{});
      renderWishlist();
      showToast("Item removed from saved");
    }

    function moveToCart(e, index) {
      e.stopPropagation();
      const item = savedItems[index];
      if (!item) return;

      let cart = JSON.parse(localStorage.getItem("cart") || "[]");
      const existing = cart.find(i => i.id === item.id);

      if (existing) {
        existing.quantity = Math.min(99, (parseInt(existing.quantity) || 1) + 1);
      } else {
        cart.push({
          id: item.id,
          title: item.title,
          price: item.offerPrice || item.price,
          originalPrice: item.price,
          image: item.image,
          size: "Standard",
          quantity: 1,
          stock: 99,
          addedAt: Date.now()
        });
      }

      localStorage.setItem("cart", JSON.stringify(cart));
      updateCartBadge();
      db.ref(`users/${currentUserId}/cart`).set(cart).catch(()=>{});

      // Remove from saved
      removeWishItem(e, index, item.id);
      showToast("Moved to Cart");
    }

    window.addEventListener("DOMContentLoaded", loadSavedItems);
  </script>
</body>
</html>
